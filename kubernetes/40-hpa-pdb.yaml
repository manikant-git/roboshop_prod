---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: frontend, namespace: roboshop }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: frontend } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: catalogue, namespace: roboshop }
