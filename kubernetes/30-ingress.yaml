# AWS Load Balancer Controller (ALB Ingress) - internet facing, HTTP -> HTTPS.
#
# Prerequisites:
#   1. AWS Load Balancer Controller installed in the cluster (IRSA role with
#      the AWSLoadBalancerControllerIAMPolicy attached).
#   2. Public subnets tagged kubernetes.io/role/elb=1.
#   3. An ACM certificate for the host below (or drop the TLS annotations and
#      the redirect rule to run plain HTTP for a smoke test).
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
spec:
  controller: ingress.k8s.aws/alb
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roboshop
  namespace: roboshop
  labels: { app.kubernetes.io/part-of: roboshop }
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: roboshop-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    # Replace with your ACM certificate ARN.
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT_ID:certificate/REPLACE_ME
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/load-balancer-attributes: >-
      idle_timeout.timeout_seconds=60,
      routing.http2.enabled=true,
      routing.http.drop_invalid_header_fields.enabled=true,
      deletion_protection.enabled=false
    alb.ingress.kubernetes.io/tags: Project=roboshop,Environment=production
    alb.ingress.kubernetes.io/group.name: roboshop
spec:
  ingressClassName: alb
  rules:
    # Replace with your DNS name, or delete `host:` to accept any hostname.
    - host: shop.example.com
      http:
        paths:
          # nginx in the frontend pod terminates every path, including /api/*,
          # so the ALB only needs a single default rule.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
