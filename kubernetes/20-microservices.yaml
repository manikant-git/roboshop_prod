# Application microservices: Deployment + Service for each.
# Every pod runs unprivileged with a read-only root filesystem where the
# runtime allows it, and exposes /health for the kubelet probes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: roboshop
  namespace: roboshop
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: roboshop
  labels: { app: catalogue, app.kubernetes.io/part-of: roboshop }
spec:
  selector: { app: catalogue }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: roboshop
  labels: { app: catalogue, app.kubernetes.io/part-of: roboshop }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: catalogue }
  template:
    metadata:
      labels: { app: catalogue }
    spec:
      serviceAccountName: roboshop
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: catalogue } }
      containers:
        - name: catalogue
          image: joindevops/catalogue:2.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: MONGO_URL
              valueFrom: { configMapKeyRef: { name: roboshop-config, key: MONGO_URL_CATALOGUE } }
            - name: NODE_ENV
              valueFrom: { configMapKeyRef: { name: roboshop-config, key: NODE_ENV } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
