# Default deny all ingress within the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: roboshop
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow DNS and internal pod-to-pod egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: roboshop
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector: {}
---
# Allow AWS ALB to access the frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-frontend
  namespace: roboshop
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8080
---
# Allow AWS ALB to access backend APIs directly
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-backend
  namespace: roboshop
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - catalogue
          - user
          - cart
          - shipping
          - payment
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8080
---
# Allow internal microservice communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-service-to-service
  namespace: roboshop
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - catalogue
          - user
          - cart
          - shipping
          - payment
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - catalogue
                  - user
                  - cart
                  - shipping
                  - payment
      ports:
        - protocol: TCP
          port: 8080
---
# Allow backend services to access databases
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-datastores
  namespace: roboshop
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - mongodb
          - mysql
          - redis
          - rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - catalogue
                  - user
                  - cart
                  - shipping
                  - payment
      ports:
        - protocol: TCP
          port: 27017
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 5672
