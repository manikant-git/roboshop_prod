# ---------------------------------------------------------------------------
# production environment - values shared by EVERY Roboshop chart.
# Applied first, then the chart's own values-production.yaml.
#   helm upgrade --install <svc> charts/<svc> \
#     -f environments/production/global-values.yaml \
#     -f charts/<svc>/values-production.yaml
# ---------------------------------------------------------------------------
environment: production
namespace: roboshop

image:
  registry: ""          # set to <acct>.dkr.ecr.<region>.amazonaws.com for ECR

commonAnnotations:
  roboshop.io/environment: "production"
  roboshop.io/managed-by: "platform-engineering"

extraLabels:
  roboshop.io/environment: production
