user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log  notice;
pid        /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75;
    types_hash_max_size 4096;
    server_tokens       off;
    client_max_body_size 2m;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml+rss image/svg+xml font/woff2;

    # Trust the X-Forwarded-For set by the AWS Application Load Balancer so
    # access logs and the services behind us see the real client address.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        ~.      $http_x_forwarded_proto;
    }

    include /etc/nginx/conf.d/*.conf;

    upstream catalogue_svc { server catalogue:8080 max_fails=3 fail_timeout=10s; keepalive 16; }
    upstream user_svc      { server user:8080      max_fails=3 fail_timeout=10s; keepalive 16; }
    upstream cart_svc      { server cart:8080      max_fails=3 fail_timeout=10s; keepalive 16; }
    upstream shipping_svc  { server shipping:8080  max_fails=3 fail_timeout=10s; keepalive 16; }
    upstream payment_svc   { server payment:8080   max_fails=3 fail_timeout=10s; keepalive 16; }

    server {
        listen       8080;
        listen       [::]:8080;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        include /etc/nginx/default.d/*.conf;

        # ---- security headers -------------------------------------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        error_page 500 502 503 504 /50x.html;
        location = /50x.html { internal; }

        # ---- load balancer / kubernetes probes ---------------------------
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
        location = /nginx-status {
            stub_status on;
            access_log  off;
            allow 127.0.0.1;
            deny  all;
        }

        # ---- static assets ----------------------------------------------
        location /images/ {
            expires 1h;
            add_header Cache-Control "public";
            try_files $uri /images/placeholder.jpg;
        }

        location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # The SPA templates must never be cached aggressively, they change
        # with every release.
        location ~* \.html$ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # ---- API proxying -------------------------------------------------
        location /api/catalogue/ { proxy_pass http://catalogue_svc/; include /etc/nginx/proxy_params.conf; }
        location /api/user/      { proxy_pass http://user_svc/;      include /etc/nginx/proxy_params.conf; }
        location /api/cart/      { proxy_pass http://cart_svc/;      include /etc/nginx/proxy_params.conf; }
        location /api/shipping/  { proxy_pass http://shipping_svc/;  include /etc/nginx/proxy_params.conf; }
        location /api/payment/   { proxy_pass http://payment_svc/;   include /etc/nginx/proxy_params.conf; }

        # The ratings service is not part of this deployment. Answer
        # explicitly so the SPA fallback never returns HTML for an API call.
        location /api/ratings/ {
            add_header Content-Type application/json always;
            return 501 '{"error":"ratings service is not deployed"}';
        }

        # Any other /api/ path is a client mistake, not a page.
        location /api/ {
            add_header Content-Type application/json always;
            return 404 '{"error":"unknown api endpoint"}';
        }

        # ---- SPA fallback (AngularJS html5Mode) ---------------------------
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
