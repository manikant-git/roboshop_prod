{{/*
AWS Secrets Manager -> Kubernetes Secret via External Secrets Operator.
No secret material exists in Git; only the remote key mapping.
*/}}
{{- if eq .Values.secrets.mode "external-secrets" }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ include "platform.namespace" . }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
  data:
    {{- range .Values.secrets.externalSecrets.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.secrets.externalSecrets.remoteKey }}
        property: {{ . }}
    {{- end }}
{{- end }}
