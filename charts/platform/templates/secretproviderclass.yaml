{{/*
Alternative to ESO: Secrets Store CSI Driver with the AWS provider.
Enable with secrets.mode=csi.
*/}}
{{- if eq .Values.secrets.mode "csi" }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ include "platform.namespace" . }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  provider: aws
  parameters:
    objects: |
      {{- toYaml .Values.secrets.csi.objects | nindent 6 }}
  secretObjects:
    - secretName: {{ .Values.secrets.name }}
      type: Opaque
      data:
        {{- range .Values.secrets.externalSecrets.keys }}
        - objectName: {{ . }}
          key: {{ . }}
        {{- end }}
{{- end }}
