{{- if .Values.namespaceResource.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "platform.namespace" . }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    {{- toYaml .Values.namespaceResource.labels | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    helm.sh/resource-policy: keep
    {{- with .Values.namespaceResource.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
