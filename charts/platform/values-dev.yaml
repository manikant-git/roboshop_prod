# platform - dev overrides.
environment: dev
namespace: roboshop-dev

namespaceResource:
  create: true
  labels:
    name: roboshop-dev


resourceQuota:
  enabled: true
  hard:
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    persistentvolumeclaims: "10"

storageClass:
  enabled: false   # cluster-scoped: created once per cluster
  name: gp3

sharedConfig:
  enabled: true
  data:
    NODE_ENV: "development"

secrets:
  mode: external-secrets
  externalSecrets:
    remoteKey: roboshop/dev/app
    refreshInterval: 1h

ingress:
  enabled: true
  ingressClass:
    create: false   # cluster-scoped: created once per cluster
  alb:
    loadBalancerName: roboshop-dev-alb
    groupName: roboshop-dev
    scheme: internet-facing
    listenPorts: '[{"HTTP":80}]'
    certificateArn: ""
    sslRedirect: ""
    wafv2AclArn: ""
    tags:
      Project: roboshop
      Environment: dev
      ManagedBy: helm
  hosts:
    - host: dev.shop.streenzo.online
      paths:
        - path: /api/catalogue
          pathType: Prefix
          serviceName: catalogue
          servicePort: 8080
        - path: /api/user
          pathType: Prefix
          serviceName: user
          servicePort: 8080
        - path: /api/cart
          pathType: Prefix
          serviceName: cart
          servicePort: 8080
        - path: /api/payment
          pathType: Prefix
          serviceName: payment
          servicePort: 8080
        - path: /api/shipping
          pathType: Prefix
          serviceName: shipping
          servicePort: 8080
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 80

networkPolicies:
  enabled: true
