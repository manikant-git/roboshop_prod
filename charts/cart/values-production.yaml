# cart - production overrides. Only values that differ from values.yaml.
environment: production
namespace: roboshop

replicaCount: 3
image:
  tag: "2.0.1"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "500m"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: DoNotSchedule

nodeSelector:
  workload: roboshop
tolerations:
  - key: workload
    operator: Equal
    value: roboshop
    effect: NoSchedule

commonAnnotations:
  argocd.argoproj.io/sync-wave: "1"
  roboshop.io/environment: "production"
