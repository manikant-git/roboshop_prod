# frontend - production overrides. Only values that differ from values.yaml.
environment: production
namespace: roboshop

replicaCount: 3
image:
  tag: "2.0.3"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "300m"
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: DoNotSchedule

nodeSelector:
  workload: roboshop
tolerations:
  - key: workload
    operator: Equal
    value: roboshop
    effect: NoSchedule

commonAnnotations:
  argocd.argoproj.io/sync-wave: "2"
  roboshop.io/environment: "production"
