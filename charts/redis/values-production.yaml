# redis - production overrides. Only values that differ from values.yaml.
environment: production
namespace: roboshop

image:
  tag: "7.4-alpine"
  pullPolicy: IfNotPresent

persistence:
  storageClass: gp3
  size: 50Gi

nodeSelector:
  workload: roboshop
tolerations:
  - key: workload
    operator: Equal
    value: roboshop
    effect: NoSchedule

commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"
  roboshop.io/environment: "production"
