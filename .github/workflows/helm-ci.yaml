name: helm-ci

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "charts/**"
      - "ci/**"
      - "environments/**"

  push:
    branches:
      - dev
    paths:
      - "charts/**"
      - "ci/**"
      - "environments/**"

env:
  HELM_VERSION: v3.16.3
  KUBE_VERSION: "1.30.0"

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Helm Lint
        run: |
          chmod +x ci/*.sh
          ./ci/lint.sh

  template-and-validate:
    name: Helm Template + Kubeconform
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/

      - name: Render Helm Charts
        run: |
          chmod +x ci/*.sh
          ./ci/template.sh

      - name: Validate Manifests
        run: |
          chmod +x ci/*.sh
          ./ci/validate.sh

      - name: Upload Rendered Manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: ci/_rendered
          retention-days: 7

  security:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    needs: template-and-validate
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: |
          chmod +x ci/*.sh
          ./ci/security-scan.sh || true

      - name: Generate SARIF
        if: always()
        run: |
          checkov \
            --directory ci/_rendered \
            --framework kubernetes \
            --config-file ci/checkov.yaml \
            --output sarif \
            --output-file-path results.sarif || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true

  package:
    name: Package Helm Charts
    runs-on: ubuntu-latest
    needs:
      - template-and-validate
      - security

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Package Charts
        run: |
          chmod +x ci/*.sh
          ./ci/package.sh

      - name: Upload Helm Packages
        uses: actions/upload-artifact@v4
        with:
          name: helm-packages
          path: dist/*.tgz
