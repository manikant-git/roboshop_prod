apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "catalogue.fullname" . }}
  labels:
    {{- include "catalogue.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      {{- include "catalogue.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "catalogue.selectorLabels" . | nindent 8 }}

    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}

      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "catalogue.selectorLabels" . | nindent 14 }}

      containers:
        - name: catalogue

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.service.port }}

          env:
            - name: MONGO_URL
              valueFrom:
                configMapKeyRef:
                  name: roboshop-config
                  key: MONGO_URL_CATALOGUE

            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: roboshop-config
                  key: NODE_ENV

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}

          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}

          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          volumeMounts:
            {{- toYaml .Values.volumeMounts | nindent 12 }}

      volumes:
        {{- toYaml .Values.volumes | nindent 8 }}
